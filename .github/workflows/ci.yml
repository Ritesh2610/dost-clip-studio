name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs only read the code. Nothing here needs to write to the repository.
permissions:
  contents: read

# A newer push to the same pull request cancels the run it replaces.
# Runs on main are left to finish so every commit there has a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy clipstudio
      - name: Check that the version numbers agree
        run: >-
          python -c "import tomllib, clipstudio;
          v = tomllib.load(open('pyproject.toml', 'rb'))['project']['version'];
          assert v == clipstudio.__version__, (v, clipstudio.__version__)"

  # Unit and server tests. They need no network: yt-dlp calls are stubbed, and the tests
  # that need ffmpeg make their own short clips with the ffmpeg that imageio-ffmpeg installs.
  #
  # The browser test in tests/e2e (Playwright) is not run here. Run it on your own machine
  # before changing anything in public/. CONTRIBUTING.md explains how.
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest

  # Checks the runtime dependencies against the Python advisory database.
  #
  # This job is allowed to fail: `continue-on-error` keeps the workflow green when it does,
  # and it should not be marked as a required check. A new advisory in yt-dlp or another
  # dependency should be looked at, but it should not block an unrelated pull request.
  # Read the job's output; a pass on the workflow does not mean this job passed.
  audit:
    name: audit (not required)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pip-audit
        run: python -m pip install -r requirements-dev.txt
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt
